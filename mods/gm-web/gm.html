<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalExile GM 工具</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;background:#14161a;color:#d8d4c8}
header{padding:14px 18px 6px;position:relative}
h1{margin:0;font-size:20px}
#counts{color:#8a8578;font-size:12px;margin-top:2px}
#bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 18px;background:#14161aee;border-bottom:1px solid #2a2d33;backdrop-filter:blur(4px)}
#q{flex:1;min-width:220px;padding:8px 12px;font-size:16px;background:#1e2127;color:#eee;border:1px solid #3a3e46;border-radius:6px;outline:none}
#q:focus{border-color:#c9a55c}
.rqty{width:54px;padding:4px 6px;font-size:13px;background:#1e2127;color:#eee;border:1px solid #3a3e46;border-radius:5px}
.qchip{padding:2px 8px;border-radius:10px;border:1px solid #3a3e46;background:#1e2127;color:#b6b0a2;cursor:pointer;font-size:12px}
.qchip:hover{border-color:#c9a55c;color:#fff}
.chip{padding:4px 12px;border-radius:14px;border:1px solid #3a3e46;background:#1e2127;color:#b6b0a2;cursor:pointer;font-size:13px}
.chip.on{background:#c9a55c;color:#1b1408;border-color:#c9a55c;font-weight:600}
#list{padding:6px 18px 20px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid #22252b}
.row:hover{background:#1b1e24}
.names{min-width:0}
.cn{font-size:16px}
.cn .sub{color:#8a8578;font-size:12px;margin-left:8px}
.en{color:#8a8578;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;margin-right:6px;vertical-align:2px}
.tag.area{background:#2c4a6e;color:#9cc4ee}.tag.mob{background:#5e2b2b;color:#ee9c9c}.tag.npc{background:#3f5e2f;color:#b6e29c}
.tag.chest{background:#6e5a24;color:#eeD799}.tag.item{background:#4a3a6e;color:#c4a9ee}
.btns{display:flex;gap:6px;flex:none}
button{padding:5px 10px;font-size:13px;background:#2a2d33;color:#d8d4c8;border:1px solid #3a3e46;border-radius:5px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#c9a55c;color:#fff}
button.ok{background:#3f5e2f;color:#dff0d0;border-color:#3f5e2f}
button.send{background:#3f5e2f;color:#dff0d0;border-color:#3f5e2f;font-weight:600}
button.send:hover{border-color:#c9a55c;color:#fff}
button.send:disabled{opacity:.7;cursor:default}
code{background:#22252b;padding:1px 5px;border-radius:3px;font-size:12px}
#more{color:#8a8578;padding:8px}
#help{margin:0 18px 30px;border:1px solid #2a2d33;border-radius:8px;padding:10px 14px}
#help summary{cursor:pointer;font-weight:600;color:#c9a55c}
#help td{padding:3px 10px 3px 0;vertical-align:top;font-size:13px}
#foot{color:#666;font-size:11px;text-align:center;padding-bottom:20px}
#run{padding:0 18px 6px}
#quick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
#cmdbar{display:flex;gap:8px;align-items:center}
#cmd{flex:1;min-width:200px;padding:8px 12px;font:14px Consolas,monospace;background:#1e2127;color:#eee;border:1px solid #3a3e46;border-radius:6px;outline:none}
#cmd:focus{border-color:#c9a55c}
#send{padding:8px 22px;font-size:15px;font-weight:600;background:#3f5e2f;color:#dff0d0;border:1px solid #3f5e2f;border-radius:6px;cursor:pointer;white-space:nowrap}
#send:hover{border-color:#c9a55c;color:#fff}
#status{font-size:12px;color:#8a8578;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.ok{color:#b6e29c}#status.err{color:#ee9c9c}
#tppanel{padding:6px 18px 20px}
.tphead{margin:4px 0 8px;color:#b6b0a2;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
#tpq{flex:1;min-width:200px;max-width:420px;padding:7px 12px;font-size:14px;background:#1e2127;color:#eee;border:1px solid #3a3e46;border-radius:6px;outline:none}
#tpq:focus{border-color:#c9a55c}
#tpmore{color:#8a8578;padding:8px}
#fab{position:fixed;right:22px;bottom:22px;z-index:9;width:54px;height:54px;border-radius:50%;background:#c9a55c;color:#1b1408;
  font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
  box-shadow:0 2px 14px #000a;border:0}
#fab:hover{filter:brightness(1.12)}
#fpanel{position:fixed;right:22px;bottom:88px;z-index:9;width:350px;max-height:78vh;overflow:auto;display:none;
  background:#1b1e24f2;border:1px solid #3a3e46;border-radius:10px;padding:12px 12px 6px;backdrop-filter:blur(4px);box-shadow:0 4px 22px #000c}
#fpanel h2{margin:0 0 8px;font-size:15px;color:#c9a55c}
.fpg{margin-bottom:10px}
.fpg h3{margin:0 0 6px;font-size:12px;color:#8a8578;font-weight:600}
.fpbtns{display:flex;flex-wrap:wrap;gap:6px}
.fpbtns button{font-size:12px;padding:5px 10px}
.fpbtns button[data-mode=fill]{border-style:dashed}
.fpnote{color:#666;font-size:11px;margin:2px 0 8px}
#langs{position:absolute;top:14px;right:18px;display:flex;gap:6px}
.lchip{padding:2px 10px;border-radius:10px;border:1px solid #3a3e46;background:#1e2127;color:#b6b0a2;cursor:pointer;font-size:12px}
.lchip.on{background:#c9a55c;color:#1b1408;border-color:#c9a55c;font-weight:600}
</style></head><body>
<header><h1><span data-i18n="title">LocalExile GM 工具</span></h1><div id="counts"></div>
<div id="langs"><span class="lchip" data-lang="zh">中</span><span class="lchip" data-lang="en">EN</span></div></header>
<div id="bar">
  <input id="q" data-i18n-ph="searchPh" placeholder="中文（简/繁）或英文搜索…" autofocus>
  <span id="chips"></span>
</div>
<div id="run">
  <div id="quick"></div>
  <div id="cmdbar">
    <input id="cmd" data-i18n-ph="cmdPh" placeholder="点上面的按钮选命令…" autocomplete="off" spellcheck="false">
    <button id="send" data-i18n="send">发送</button><span id="status"></span>
  </div>
</div>
<div id="list"></div>
<div id="tppanel" style="display:none">
  <div class="tphead"><span id="tparea"></span><button id="tprefresh" data-i18n="refreshBtn">刷新</button></div>
  <div class="tpbar"><input id="tpq" data-i18n-ph="tpqPh" placeholder="过滤当前区域目标…"><span id="tpchips"></span></div>
  <div id="tlist"></div>
  <div id="tpmore"></div>
</div>
<details id="help"><summary data-i18n="helpTitle">常用命令速查（点开）</summary><table id="helptbl"></table></details>
<div id="fab" title="快捷操作">GM</div>
<div id="fpanel">
  <h2 data-i18n="fpTitle">快捷操作（一键生效）</h2>
  <div id="fpgroups"></div>
  <div class="fpnote" data-i18n="fpNote">直发模式点击即执行，结果看游戏内聊天；虚线按钮=填入命令栏补参数</div>
</div>
<div id="foot"></div>
<script>
// ———— i18n ————
const I18N={"zh":{"title":"LocalExile GM 工具","trade":"交易行 »","searchPh":"搜索英文名：区域 /goto、怪物 /tp /spawn_mob、物品 /item…","cmdPh":"点上面的按钮选命令 →（可编辑）→ 回车或点发送，自动在游戏里生效…","send":"发送","copy":"复制","all":"全部","tpTab":"本图传送","town":" · 城镇","more":"共 {n} 条，只显示前 150 —— 输入更多关键字缩小范围","moreTp":"共 {n} 条，只显示前 300 —— 输入关键字缩小范围","noMatch":"没有匹配项","namesMissing":"名字表由服务器提供（GET /names）：请开服后用 http://127.0.0.1:6111/ 打开本页；命令栏不受影响。","copied":"已复制","pickFirst":"先点上面的按钮选一条命令","copiedFile":"已复制（直发需开服后用 http://127.0.0.1:6111/ 打开本页）","sending":"发送中…","nobody":"没有角色在游戏里，先登录","nobodyShort":"没有角色在游戏","sentOkShort":"已发送 ✓","sendFail":"发送失败：HTTP ","sentOk":"已发送 ✓（结果看游戏内聊天）","noServer":"连不上服务器（服务端开了吗？）","noServerShort":"连不上服务器","onlineYes":"在线：","onlineNo":"服务器已开，还没有角色进游戏","clickSend":"点击直接发送","clickCopy":"点击直接复制","sentPrefix":"已发送：","spawnL":"刷","spectreL":"灵体","tpL":"传送","enterBtn":"进入","enterTitle":"/goto 直接进入该区域","refreshBtn":"刷新","qtyHint":"数量 1-10","tpqPh":"过滤当前区域目标：中文名 / 英文名 / 坐标…","tpNeedServed":"本图传送需要直发模式：开服后用 http://127.0.0.1:6111/ 打开本页","loading":"加载中…","tpNobody":"没有角色在游戏里，登录后点「刷新」","curArea":"当前区域","seedL":"种子","meL":"我","truncated":"物件过多，只列前 800","kAll":"全部","kMonster":"怪物","kNpc":"NPC","kTransition":"出口","kWaypoint":"传送点","kArrival":"出生点","kObject":"物件","fpTitle":"快捷操作（一键生效）","fpNote":"直发模式点击即执行，结果看游戏内聊天；虚线按钮=填入命令栏补参数","fillNote":"已填入命令栏，补参数后回车发送","helpTitle":"常用命令速查（点开）","foot":"本页随 gm-web mod 附带 · 直发模式：开服后用 http://127.0.0.1:6111/ 打开"},"en":{"title":"LocalExile GM Tool","trade":"Trade »","searchPh":"Search EN names: areas /goto, monsters /tp /spawn_mob, items /item…","cmdPh":"Pick a command with the buttons above → (editable) → Enter or Send runs it in game…","send":"Send","copy":"Copy","all":"All","tpTab":"In-area TP","town":" · town","more":"{n} matches, showing the first 150 — type more to narrow down","moreTp":"{n} matches, showing the first 300 — type a keyword to narrow down","noMatch":"No matches","namesMissing":"The name tables come from the server (GET /names): open this page from a running server at http://127.0.0.1:6111/; the command bar keeps working.","copied":"Copied","pickFirst":"Pick a command button above first","copiedFile":"Copied (open this page from the server at http://127.0.0.1:6111/ to send directly)","sending":"Sending…","nobody":"Nobody is in game — log in first","nobodyShort":"nobody in game","sentOkShort":"Sent ✓","sendFail":"Send failed: HTTP ","sentOk":"Sent ✓ (see the in-game chat)","noServer":"Cannot reach the server — is it running?","noServerShort":"server unreachable","onlineYes":"Online: ","onlineNo":"Server is up, nobody has entered the game yet","clickSend":"click to send directly","clickCopy":"click to copy directly","sentPrefix":"sent: ","spawnL":"spawn","spectreL":"spectre","tpL":"TP","enterBtn":"Enter","enterTitle":"/goto straight into that area","refreshBtn":"Refresh","qtyHint":"qty 1-10","tpqPh":"Filter targets: CN name / EN name / coords…","tpNeedServed":"In-area TP needs the served page: open http://127.0.0.1:6111/ with the server running","loading":"Loading…","tpNobody":"Nobody is in game — log in, then Refresh","curArea":"Current area","seedL":"seed","meL":"me","truncated":"too many objects — first 800 shown","kAll":"All","kMonster":"Monster","kNpc":"NPC","kTransition":"Exit","kWaypoint":"Waypoint","kArrival":"Spawn","kObject":"Object","fpTitle":"Quick actions","fpNote":"Served mode: one click runs it, results in the in-game chat; dashed buttons fill the command bar for parameters","fillNote":"Filled into the command bar — add parameters, then press Enter","helpTitle":"Common commands (click to open)","foot":"this page ships with the gm-web mod · open it from the running server at http://127.0.0.1:6111/ · names via GET /names"}};
const UP=true;
const urlLang=new URLSearchParams(location.search).get('lang');
let LANG=urlLang==='zh'||urlLang==='en'?urlLang:localStorage.getItem('lang')||((navigator.language||'zh').toLowerCase().startsWith('zh')?'zh':'en');
const t=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.zh[k]||k;
const L=(a,b)=>LANG==='zh'?a:b;
const SERVED=location.protocol==='http:';
const LIST=document.getElementById('list'),Q=document.getElementById('q'),
      CHIPS=document.getElementById('chips'),COUNTS=document.getElementById('counts'),
      CMD=document.getElementById('cmd'),SEND=document.getElementById('send'),STATUS=document.getElementById('status');
let type='all';
const TYPES=[["area","区域","Areas"],["mob","怪物","Monsters"],["item","物品","Items"]];
const tLabel=k=>{const x=TYPES.find(e=>e[0]===k);return x?L(x[1],x[2]):k};
let D=null;
const MOBCN={},NPCCN={},AREACN={},CHESTCN={};
function buildIndexes(){
  (D.mob||[]).forEach(e=>MOBCN[e[2]]=e);(D.npc||[]).forEach(e=>NPCCN[e[2]]=e);
  (D.area||[]).forEach(e=>AREACN[e[3]]=e);(D.chest||[]).forEach(e=>CHESTCN[e[3]]=e);}
function updateCounts(){COUNTS.textContent=D?TYPES.map(x=>tLabel(x[0])+' '+(D[x[0]]||[]).length).join(' · '):'';}
function applyUI(){
  document.title=t('title');document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  SEND.textContent=SERVED?t('send'):t('copy');
  document.getElementById('fab').title=t('fpTitle');}
document.getElementById('langs').onclick=e=>{const c=e.target.closest('.lchip');if(c)setLang(c.dataset.lang);};
function setLang(l){if(l===LANG)return;LANG=l;localStorage.setItem('lang',l);
  applyUI();renderChips();renderQuick();renderHelp();renderPanel();renderTpChips();updateCounts();render();}
// ———— 数据表搜索 ————
function renderChips(){
  CHIPS.innerHTML=[['all',t('all')],['tp',t('tpTab')],...TYPES.map(x=>[x[0],tLabel(x[0])])]
    .map(c=>`<span class="chip${c[0]===type?' on':''}" data-t="${c[0]}">${c[1]}</span>`).join('');}
CHIPS.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  CHIPS.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  type=c.dataset.t;render();};
function qtyCtl(vals){return '<input class="rqty" type="number" value="1" min="1" max="9999" title="'+t('qtyHint')+'">'+
  vals.map(n=>`<span class="qchip" data-q="${n}">${n}</span>`).join('');}
const snd=attr=>SERVED?`<button class="send" ${attr}>${t('send')}</button>`:'';
function rowBtns(ty,e){
  if(ty==='mob'){let h=`<button data-cmd="${esc('/tp '+e[2])}">/tp</button><button data-cmd="${esc('/spawn_mob '+e[2])}" title="/spawn_mob">${t('spawnL')}</button>`;
    if(!UP)h+=qtyCtl([1,3,10])+`<button data-spectre="${esc(e[2])}" title="/spectres add · ${t('qtyHint')}">${t('spectreL')}</button>`+
      snd(`data-spectre="${esc(e[2])}" title="/spectres add"`);
    return h;}
  if(ty==='area')return `<button data-cmd="${esc('/goto '+e[3])}">/goto</button>`+
    snd(`data-cmd="${esc('/goto '+e[3])}" title="/goto"`);
  if(ty==='npc')return `<button data-cmd="${esc('/tp '+e[2])}">/tp</button>`;
  if(ty==='chest')return `<button data-cmd="${esc('/tp '+e[3])}">/tp</button>`;
  const give=UP?'/item':'/give';
  return qtyCtl([1,10,40,100])+`<button data-give="${esc(e[3])}">${give}</button>`+
    snd(`data-give="${esc(e[3])}" title="${give}"`);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function namesMissing(){if(type!=='tp')LIST.innerHTML='<div id="more">'+esc(t('namesMissing'))+'</div>';}
function render(){
  if(type==='tp'){LIST.style.display='none';TP.style.display='block';loadTp(false);return;}
  LIST.style.display='';TP.style.display='none';
  if(!D){namesMissing();return;}
  const q=Q.value.trim(),ql=q.toLowerCase();
  const m=e=>!ql||e[0].indexOf(q)>=0||e[1].indexOf(q)>=0||e[2].toLowerCase().indexOf(ql)>=0||e[3].toLowerCase().indexOf(ql)>=0;
  let total=0,html='',shown=0;
  for(const[ty]of TYPES){
    if(type!=='all'&&type!==ty)continue;
    for(const e of D[ty]||[]){
      if(!m(e))continue;total++;
      if(shown>=150)continue;shown++;
      const sub=ty==='area'?' <span class="sub">'+e[3]+(e[4]?L(' · 城镇',' · town'):'')+'</span>':'';
      const info=ty==='mob'?' · '+e[3].split('/').pop():(ty==='chest'?' · '+e[3]:(ty==='area'?'':(ty==='npc'?' · '+e[3].split('/').pop():'')));
      const btns=rowBtns(ty,e);
      html+=`<div class="row"><div class="names"><div class="cn"><span class="tag ${ty}">${tLabel(ty)}</span>${esc(e[0])}${sub}</div><div class="en">${esc(e[2])}${info}</div></div><div class="btns">${btns}</div></div>`;
    }
  }
  LIST.innerHTML=html+(total>150?'<div id="more">'+t('more').replace('{n}',total)+'</div>':(total?'':'<div id="more">'+t('noMatch')+'</div>'));
}
LIST.onclick=e=>{
  const c=e.target.closest('.qchip');
  if(c){c.closest('.row').querySelector('.rqty').value=c.dataset.q;return;}
  const b=e.target.closest('button');if(!b)return;
  const n=Math.max(1,parseInt(b.closest('.row').querySelector('.rqty')?.value,10)||1);
  let full=b.dataset.cmd;
  if(b.dataset.give)full=(UP?'/item ':'/give ')+b.dataset.give+' '+n;
  else if(b.dataset.spectre)full='/spectres add '+b.dataset.spectre+(n>1?' '+Math.min(n,10):'');
  if(b.classList.contains('send')){runNow(full,b);return;}
  CMD.value=full;
  if(!SERVED)copy(full,b);else CMD.focus();};
// ———— 命令栏 ————
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);}
  catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  const old=btn.textContent;btn.textContent=t('copied');btn.classList.add('ok');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok');},900);
}
function status(msg,cls){STATUS.textContent=msg;STATUS.className=cls||'';}
async function send(){
  const cmd=CMD.value.trim();
  if(!cmd){status(t('pickFirst'),'err');return;}
  if(!SERVED){await copy(cmd,SEND);status(t('copiedFile'),'ok');return;}
  status(t('sending'));
  try{
    const r=await fetch('/run',{method:'POST',body:cmd});
    if(r.status===503){status(t('nobody'),'err');return;}
    if(!r.ok){status(t('sendFail')+r.status,'err');return;}
    status(t('sentOk'),'ok');
  }catch(_){status(t('noServer'),'err');}
}
SEND.onclick=send;CMD.onkeydown=e=>{if(e.key==='Enter')send();};
async function runNow(cmd,btn){
  const old=btn.textContent;btn.textContent=t('sending');btn.disabled=true;
  try{
    const r=await fetch('/run',{method:'POST',body:cmd});
    btn.textContent=r.status===503?t('nobodyShort'):r.ok?t('sentOkShort'):'HTTP '+r.status;
    if(r.ok)status(t('sentPrefix')+cmd,'ok');
  }catch(_){btn.textContent=t('noServerShort');status(t('noServer'),'err');}
  setTimeout(()=>{btn.textContent=old;btn.disabled=false;},1200);
}
// ———— 常用命令 ————
const QUICK=[["满血","Full heal","/heal"],["无敌","God mode","/god"],["杀身边怪","Kill near","/kill near"],["杀全图怪","Kill all","/kill all"],["杀Boss","Kill boss","/kill boss"],["充能","Charges","/charges"],["光环","Auras","/auras"],["抗性","Resistances","/resistances"],["全传送点","All waypoints","/waypoints all"],["本图怪物","Mobs in area","/mobs"],["本图目标","Targets in area","/tp list"],["位置","Where am I","/pos"]];
function renderQuick(){
  document.getElementById('quick').innerHTML=QUICK.map(q=>`<span class="chip" data-cmd="${esc(q[2])}" title="${esc(q[2])} · ${t(SERVED?'clickSend':'clickCopy')}">${esc(L(q[0],q[1]))}</span>`).join('');}
document.getElementById('quick').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  CMD.value=c.dataset.cmd;
  if(SERVED)runNow(c.dataset.cmd,c);else copy(c.dataset.cmd,c);};
// ———— 本图传送面板：GET /tp（gm-web）返回 gm-commands /tp 的同一候选表，点击即发 ——
const TP=document.getElementById('tppanel'),TQ=document.getElementById('tpq'),TLIST=document.getElementById('tlist'),
      TAREA=document.getElementById('tparea'),TPCHIPS=document.getElementById('tpchips'),TPMORE=document.getElementById('tpmore');
const KINDTAG={monster:'mob',npc:'npc',transition:'area',waypoint:'chest',arrival:'chest',object:'chest'};
const KINDKEY={monster:'kMonster',npc:'kNpc',transition:'kTransition',waypoint:'kWaypoint',arrival:'kArrival',object:'kObject'};
const kindLabel=k=>t(KINDKEY[k]||'kObject');
function tpCn(x){
  if(x.kind==='monster')return MOBCN[x.name.split('@')[0]]||null;   // 带 @等级 后缀的任务怪剥掉再查
  if(x.kind==='npc')return NPCCN[x.name]||null;
  if(x.kind==='transition'&&x.dest)return AREACN[x.dest]||null;
  if(x.kind==='object')return CHESTCN[x.name]||null;
  return null;}
let tpData=null,tpKind='all';
function renderTpChips(){
  TPCHIPS.innerHTML=[['all','kAll'],['monster','kMonster'],['npc','kNpc'],['transition','kTransition'],['waypoint','kWaypoint'],['object','kObject']]
    .map(c=>`<span class="chip${c[0]===tpKind?' on':''}" data-k="${c[0]}">${t(c[1])}</span>`).join('');}
TPCHIPS.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  TPCHIPS.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  tpKind=c.dataset.k;renderTp();};
async function loadTp(force){
  if(!SERVED){TAREA.textContent=t('tpNeedServed');TLIST.innerHTML='';TPMORE.textContent='';return;}
  if(tpData&&!force)return;
  TAREA.textContent=t('loading');
  try{
    const r=await fetch('/tp');
    tpData=r.status===503?{online:false,targets:[]}:await r.json();
  }catch(_){tpData={online:false,targets:[]};}
  renderTp();}
function renderTp(){
  if(!tpData)return;
  if(!tpData.online){TAREA.textContent=t('tpNobody');TLIST.innerHTML='';TPMORE.textContent='';return;}
  const a=tpData.area,acn=a&&AREACN[a.id];
  TAREA.innerHTML=`${t('curArea')} <b style="color:#c9a55c">${esc(acn?acn[0]:a.name||a.id)}</b> ${esc(a.name&&a.name!==a.id&&!acn?a.name+' · ':'')}${esc(a.id)} · ${t('seedL')} ${a.seed} · ${t('meL')} (${tpData.playerX}, ${tpData.playerY})${tpData.truncated?' · '+t('truncated'):''}`;
  const seen={};
  tpData.targets.forEach(x=>{const k=x.name.toLowerCase();seen[k]=(seen[k]||0)+1;x.n=seen[k];});
  const q=TQ.value.trim().toLowerCase();
  let total=0,shown=0,html='';
  for(const tg of tpData.targets){
    if(tpKind!=='all'&&tg.kind!==tpKind&&!(tpKind==='waypoint'&&tg.kind==='arrival'))continue;
    const cn=tpCn(tg);
    const hay=(tg.name+' '+(cn?cn[0]+' '+cn[1]+' '+cn[2]+' ':'')+(tg.destEn||'')+' '+(tg.dest||'')+' '+tg.kind).toLowerCase();
    if(q&&!hay.includes(q))continue;
    total++;if(shown>=300)continue;shown++;
    const tpCmd=tg.id!=null?'/tp 0x'+tg.id.toString(16):'/tp '+tg.name+(tg.n>1?' '+tg.n:'');
    const go=tg.kind==='transition'&&tg.dest&&!tg.dest.startsWith('0x')&&tg.dest!==tpData.area.id?`<button data-goto="${esc(tg.dest)}" title="${esc(t('enterTitle'))}">${t('enterBtn')}</button>`:'';
    const sub=tg.kind==='transition'&&cn?`${esc(cn[2])} · ${esc(tg.name)}`:esc(tg.name);
    html+=`<div class="row"><div class="names"><div class="cn"><span class="tag ${KINDTAG[tg.kind]}">${kindLabel(tg.kind)}</span>${esc(cn?cn[0]:tg.name)}${tg.n>1?' <span class="sub">#'+tg.n+'</span>':''}</div><div class="en">${sub} · (${tg.x}, ${tg.y})</div></div><div class="btns">${go}<button class="send" data-tcmd="${esc(tpCmd)}">${t('tpL')}</button></div></div>`;}
  TLIST.innerHTML=html;
  TPMORE.textContent=total>300?t('moreTp').replace('{n}',total):(total?'':t('noMatch'));}
TLIST.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.goto){runNow('/goto '+b.dataset.goto,b);return;}
  if(b.dataset.tcmd)runNow(b.dataset.tcmd,b);};
document.getElementById('tprefresh').onclick=()=>loadTp(true);
TQ.oninput=()=>renderTp();
